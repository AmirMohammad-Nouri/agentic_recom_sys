<svg aria-label="The stages of one chat turn" color="#4f5f57" font-family="system-ui, -apple-system, Segoe UI, sans-serif" height="400" role="img" viewbox="0 0 880 224" width="800" xmlns="http://www.w3.org/2000/svg"><rect fill="#ffffff" height="400.0" width="800.0" x="0.0" y="0.0"></rect><defs><marker id="ah4" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#4f5f57"></path></marker></defs><rect fill="#ffffff" height="60" rx="8" stroke="#dbe3dd" stroke-width="1.5" width="180" x="10" y="20"></rect><text fill="#1d2a24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13px" font-weight="600" text-anchor="middle" x="100.0" y="44.0">Perceive</text><text fill="#4f5f57" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5px" text-anchor="middle" x="100.0" y="60.0">goal · last list · history</text><rect fill="#f8eedb" height="60" rx="8" stroke="#a46a14" stroke-width="1.5" width="180" x="240" y="20"></rect><text fill="#1d2a24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13px" font-weight="600" text-anchor="middle" x="330.0" y="44.0">Understand</text><text fill="#4f5f57" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5px" text-anchor="middle" x="330.0" y="60.0">Qwen JSON, or rules</text><polyline fill="none" marker-end="url(#ah4)" opacity=".75" points="190,50 240,50" stroke="#4f5f57" stroke-width="1.4"></polyline><rect fill="#ffffff" height="60" rx="8" stroke="#dbe3dd" stroke-width="1.5" width="180" x="470" y="20"></rect><text fill="#1d2a24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13px" font-weight="600" text-anchor="middle" x="560.0" y="44.0">Plan</text><text fill="#4f5f57" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5px" text-anchor="middle" x="560.0" y="60.0">intent → skills</text><polyline fill="none" marker-end="url(#ah4)" opacity=".75" points="420,50 470,50" stroke="#4f5f57" stroke-width="1.4"></polyline><rect fill="#ffffff" height="60" rx="8" stroke="#dbe3dd" stroke-width="1.5" width="180" x="700" y="20"></rect><text fill="#1d2a24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13px" font-weight="600" text-anchor="middle" x="790.0" y="44.0">Act</text><text fill="#4f5f57" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5px" text-anchor="middle" x="790.0" y="60.0">engine · graph · search</text><polyline fill="none" marker-end="url(#ah4)" opacity=".75" points="650,50 700,50" stroke="#4f5f57" stroke-width="1.4"></polyline><rect fill="#ffffff" height="60" rx="8" stroke="#dbe3dd" stroke-width="1.5" width="180" x="10" y="130"></rect><text fill="#1d2a24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13px" font-weight="600" text-anchor="middle" x="100.0" y="154.0">Validate</text><text fill="#4f5f57" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5px" text-anchor="middle" x="100.0" y="170.0">numbers &amp; titles checked</text><rect fill="#f8eedb" height="60" rx="8" stroke="#a46a14" stroke-width="1.5" width="180" x="240" y="130"></rect><text fill="#1d2a24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13px" font-weight="600" text-anchor="middle" x="330.0" y="154.0">Phrase</text><text fill="#4f5f57" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5px" text-anchor="middle" x="330.0" y="170.0">Qwen rewrites (optional)</text><polyline fill="none" marker-end="url(#ah4)" opacity=".75" points="240,160 190,160" stroke="#4f5f57" stroke-width="1.4"></polyline><rect fill="#ffffff" height="60" rx="8" stroke="#dbe3dd" stroke-width="1.5" width="180" x="470" y="130"></rect><text fill="#1d2a24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13px" font-weight="600" text-anchor="middle" x="560.0" y="154.0">Compose</text><text fill="#4f5f57" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5px" text-anchor="middle" x="560.0" y="170.0">facts → template</text><polyline fill="none" marker-end="url(#ah4)" opacity=".75" points="470,160 420,160" stroke="#4f5f57" stroke-width="1.4"></polyline><rect fill="#ffffff" height="60" rx="8" stroke="#dbe3dd" stroke-width="1.5" width="180" x="700" y="130"></rect><text fill="#1d2a24" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13px" font-weight="600" text-anchor="middle" x="790.0" y="154.0">Follow up</text><text fill="#4f5f57" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5px" text-anchor="middle" x="790.0" y="170.0">≤ 1 extra skill</text><polyline fill="none" marker-end="url(#ah4)" opacity=".75" points="700,160 650,160" stroke="#4f5f57" stroke-width="1.4"></polyline><polyline fill="none" marker-end="url(#ah4)" opacity=".75" points="790,80 790,130" stroke="#4f5f57" stroke-width="1.4"></polyline><polyline fill="none" marker-end="url(#ah4)" opacity=".75" points="100,190 100,214" stroke="#4f5f57" stroke-width="1.4"></polyline><text fill="#4f5f57" font-family="ui-monospace, Menlo, monospace" font-size="11px" font-weight="500" text-anchor="start" x="108" y="210">stream answer</text></svg>