[project]
name = "foodrec"
version = "0.4.0"
description = "Transparent, controllable multi-criteria food recommendation with a supervisor agent, knowledge graph and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "neo4j>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Claude as the supervisor model (llm.provider = "anthropic")
anthropic = ["anthropic>=2.3"]
# only for rebuilding the catalogue from the HUMMUS spreadsheet (python -m foodrec.ingest)
ingest = ["pandas>=2.0", "openpyxl>=3.1"]

[project.scripts]
foodrec = "foodrec.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foodrec*"]

[tool.setuptools.package-data]
foodrec = ["web/*", "web/views/*", "web/guides/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
