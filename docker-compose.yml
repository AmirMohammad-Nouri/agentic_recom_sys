# Optional services. The app runs without any of them (see README "Degradation").
#   docker compose up -d neo4j            knowledge graph
#   docker compose --profile qdrant up -d  Qdrant server instead of the embedded store
# Ollama is best installed natively so it can use the GPU directly (https://ollama.com).
services:
  neo4j:
    image: neo4j:5.26-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-please}
      NEO4J_server_memory_heap_max__size: 1G
    volumes: ["neo4j-data:/data"]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["qdrant"]
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
volumes:
  neo4j-data:
  qdrant-data:
